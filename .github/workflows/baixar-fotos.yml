name: Baixar fotos dos locais

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fotos.json"
      - "scripts/baixar_fotos.py"
      - ".github/workflows/baixar-fotos.yml"

permissions:
  contents: write

concurrency:
  group: baixar-fotos
  cancel-in-progress: true

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/baixar_fotos.py
      - name: Salvar fotos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos
          git commit -m "Fotos candidatas dos locais (Wikimedia Commons)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

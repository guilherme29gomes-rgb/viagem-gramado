<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Roteiro Gramado</title>
  <meta name="description" content="Roteiro de viagem para Gramado e Canela, de 07 a 12 de novembro.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone-branco-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gramado">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Mulish:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <p class="topo-sub">Gramado · Canela · Novembro 2026</p>
      <h1>Roteiro de Natal</h1>
      <p class="ornamento" aria-hidden="true"><span></span>✦<span></span></p>
      <p class="contagem"><span id="contagem"></span> · 07 a 12 de novembro</p>
    </div>
  </header>

  <main id="app">
    <section id="aba-roteiro" class="aba ativa" aria-labelledby="tab-roteiro"></section>
    <section id="aba-pendencias" class="aba" aria-labelledby="tab-pendencias"></section>
    <section id="aba-mala" class="aba" aria-labelledby="tab-mala"></section>
    <section id="aba-ingressos" class="aba" aria-labelledby="tab-ingressos"></section>
    <section id="aba-extras" class="aba" aria-labelledby="tab-extras"></section>
    <section id="aba-descontos" class="aba" aria-labelledby="tab-descontos"></section>
  </main>

  <nav class="abas" role="tablist">
    <button role="tab" id="tab-roteiro" data-aba="roteiro" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Roteiro</button>
    <button role="tab" id="tab-pendencias" data-aba="pendencias"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4 4L19 7"/></svg>Pendências</button>
    <button role="tab" id="tab-mala" data-aba="mala"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V4.5h6V7M4 12h16"/></svg>Mala</button>
    <button role="tab" id="tab-ingressos" data-aba="ingressos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M14 7v10" stroke-dasharray="2 2"/></svg>Ingressos</button>
    <button role="tab" id="tab-extras" data-aba="extras"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>Extras</button>
    <button role="tab" id="tab-descontos" data-aba="descontos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>Descontos</button>
  </nav>

  <dialog id="galeria">
    <div class="galeria-topo">
      <h2 id="galeria-titulo"></h2>
      <button class="fechar" aria-label="Fechar">✕</button>
    </div>
    <div id="galeria-fotos" class="galeria-fotos"></div>
    <p class="galeria-links" id="galeria-links"></p>
  </dialog>

  <script src="data.js"></script>
  <script src="fotos.js"></script>
  <script src="app.js"></script>
</body>
</html>
